plugins {
    id "com.android.application"
}

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace "com.lucasli.meqr"
    compileSdk 35

    defaultConfig {
        applicationId "com.lucasli.meqr.phonematch20260910"
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName "1.1.0"
        testInstrumentationRunner "com.lucasli.meqr.TagUxInstrumentation"
    }

    signingConfigs {
        release {
            storeFile rootProject.file(keystoreProps["storeFile"] ?: "meqr-release.keystore")
            storePassword keystoreProps["storePassword"]
            keyAlias keystoreProps["keyAlias"] ?: "meqr"
            keyPassword keystoreProps["keyPassword"]
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
        debug {
            // 统一用正式签名，保证公测包升级链与备案证书一致
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation "com.google.zxing:core:3.5.3"
}
